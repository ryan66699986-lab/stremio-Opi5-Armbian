name: Build ARM64 package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Confirm native ARM64 runner
        run: |
          uname -a
          test "$(dpkg --print-architecture)" = arm64

      - name: Install Ubuntu 26.04 build dependencies
        run: ./scripts/install-deps.sh

      - name: Inspect reference ARM64 package ELF dependencies
        run: ./scripts/inspect-upstream-deb.sh

      - name: Build official Stremio 4.4.181 source
        run: |
          set -o pipefail
          ./scripts/build.sh 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stremio-arm64-build-log
          path: build.log
          if-no-files-found: warn

      - name: Build Debian package
        run: ./scripts/build-deb.sh

      - name: Validate package explicitly
        run: ./scripts/validate-deb.sh stremio_4.4.181-orp1_arm64.deb

      - name: Test apt installation and dynamic linkage
        run: |
          sudo apt-get install -y ./stremio_4.4.181-orp1_arm64.deb
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' stremio
          ldd /opt/stremio/stremio
          test -x /usr/bin/stremio
          sudo apt-get remove -y stremio

      - name: Upload ARM64 Debian package
        uses: actions/upload-artifact@v4
        with:
          name: stremio-4.4.181-orp1-arm64
          path: stremio_4.4.181-orp1_arm64.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v4.4.181-orp1
          RELEASE_ASSET: stremio_4.4.181-orp1_arm64.deb
        run: |
          set -euxo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
              --target "$GITHUB_SHA" \
              --title "Stremio 4.4.181 ARM64 (orp1)" \
              --notes "Native ARM64 Debian package for Ubuntu 26.04 / Armbian, built from pinned official Stremio 4.4.181 source and validated by CI with package installation and dynamic-link checks."
          fi
