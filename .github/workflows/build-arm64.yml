name: Build ARM64 package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Confirm native ARM64 runner
        run: |
          uname -a
          test "$(dpkg --print-architecture)" = arm64

      - name: Install Ubuntu 26.04 build dependencies
        run: ./scripts/install-deps.sh

      - name: Inspect reference ARM64 package ELF dependencies
        run: ./scripts/inspect-upstream-deb.sh

      - name: Build pinned RK3588 V4L2-request FFmpeg and libmpv stack
        run: |
          set -o pipefail
          bash ./scripts/build-rk3588-stack.sh 2>&1 | tee rk3588-stack.log

      - name: Build official Stremio 4.4.181 source
        run: |
          set -o pipefail
          ./scripts/build.sh 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stremio-arm64-build-logs
          path: |
            rk3588-stack.log
            build.log
          if-no-files-found: warn

      - name: Build Debian package
        run: ./scripts/build-deb.sh

      - name: Validate package explicitly
        run: ./scripts/validate-deb.sh stremio_4.4.181-orp2_arm64.deb

      - name: Test apt installation and private RK3588 linkage
        run: |
          sudo apt-get install -y ./stremio_4.4.181-orp2_arm64.deb
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' stremio
          file /opt/stremio/stremio
          test -x /usr/bin/stremio
          test "$(readlink -f /usr/bin/stremio)" = /opt/stremio/stremio
          test "$(patchelf --print-rpath /opt/stremio/stremio)" = '$ORIGIN/rk3588/lib'
          ldd /opt/stremio/stremio | tee /tmp/stremio-ldd.txt
          grep -E 'libmpv\.so.*=> /opt/stremio/rk3588/lib/' /tmp/stremio-ldd.txt
          grep -E 'libavcodec\.so.*=> /opt/stremio/rk3588/lib/' /tmp/stremio-ldd.txt
          strings "$(readlink -f /opt/stremio/rk3588/lib/libmpv.so)" | grep -m1 v4l2request
          sudo apt-get remove -y stremio

      - name: Upload ARM64 Debian package
        uses: actions/upload-artifact@v4
        with:
          name: stremio-4.4.181-orp2-arm64
          path: stremio_4.4.181-orp2_arm64.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v4.4.181-orp2
          RELEASE_ASSET: stremio_4.4.181-orp2_arm64.deb
        run: |
          set -euxo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
              --target "$GITHUB_SHA" \
              --title "Stremio 4.4.181 ARM64 RK3588 V4L2-request (orp2)" \
              --notes "ARM64 Stremio package for Ubuntu 26.04 / Armbian on RK3588. Bundles a pinned private FFmpeg/libmpv V4L2-request stack under /opt/stremio/rk3588 so H.264/HEVC can use the mainline RKVDEC request API without replacing system multimedia libraries. CI validates package installation and confirms Stremio resolves libmpv/libavcodec from the private stack. Physical RK3588 playback still requires on-device verification."
          fi
