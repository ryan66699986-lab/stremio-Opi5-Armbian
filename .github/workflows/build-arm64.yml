name: Build current ARM64 package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Confirm native ARM64 runner
        run: |
          uname -a
          test "$(dpkg --print-architecture)" = arm64

      - name: Install build dependencies
        run: ./scripts/install-deps.sh

      - name: Build current RK3588 FFmpeg and libmpv stack
        run: ./scripts/build-rk3588-stack.sh

      - name: Build current Stremio Linux shell
        run: ./scripts/build.sh

      - name: Build Debian package
        run: ./scripts/build-deb.sh

      - name: Record resolved upstream revisions
        run: cat .work/current.env

      - name: Test package installation and private RK3588 linkage
        run: |
          DEB=$(find . -maxdepth 1 -name 'stremio_*-current_arm64.deb' -print -quit)
          test -n "$DEB"
          sudo apt-get install -y "$DEB"
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' stremio
          test -x /usr/bin/stremio
          test -x /opt/stremio/stremio
          test -f /opt/stremio/server.js
          test "$(patchelf --print-rpath /opt/stremio/stremio)" = '$ORIGIN/rk3588/lib'
          ldd /opt/stremio/stremio | tee /tmp/stremio-ldd.txt
          grep -E 'libmpv\.so.*=> /opt/stremio/rk3588/lib/' /tmp/stremio-ldd.txt
          grep -E 'libavcodec\.so.*=> /opt/stremio/rk3588/lib/' /tmp/stremio-ldd.txt
          strings "$(readlink -f /opt/stremio/rk3588/lib/libmpv.so)" | grep -m1 v4l2request
          sudo apt-get remove -y stremio

      - name: Upload ARM64 Debian package
        uses: actions/upload-artifact@v4
        with:
          name: stremio-current-arm64
          path: stremio_*-current_arm64.deb
          if-no-files-found: error
