name: Build ARM64 package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/install-deps.sh

      - name: Build RK3588 multimedia stack
        run: ./scripts/build-rk3588-stack.sh

      - name: Build Stremio
        run: ./scripts/build.sh

      - name: Build Debian package
        run: ./scripts/build-deb.sh

      - name: Validate Debian package and RK3588 renderer markers
        run: bash ./scripts/validate-deb.sh stremio_4.4.181-orp9_arm64.deb

      - name: Test installation and private multimedia linkage
        run: |
          set -euo pipefail
          sudo apt-get install -y ./stremio_4.4.181-orp9_arm64.deb
          test "$(dpkg-query -W -f='${Architecture}' stremio)" = arm64
          test "$(readlink -f /usr/bin/stremio)" = /opt/stremio/stremio
          ldd /opt/stremio/stremio | tee /tmp/stremio-ldd.txt
          grep -E 'libmpv\.so.*=> /opt/stremio/rk3588/lib/' /tmp/stremio-ldd.txt
          grep -E 'libavcodec\.so.*=> /opt/stremio/rk3588/lib/' /tmp/stremio-ldd.txt
          sudo apt-get remove -y stremio

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: stremio-4.4.181-orp9-arm64
          path: stremio_4.4.181-orp9_arm64.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v4.4.181-orp9
          RELEASE_ASSET: stremio_4.4.181-orp9_arm64.deb
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
              --target "$GITHUB_SHA" \
              --title "Stremio 4.4.181 ARM64 RK3588 (orp9)" \
              --notes "Orange Pi 5 Pro RK3588 build. CI validates ARM64 packaging and private V4L2-request/gpu-next linkage; physical playback validation status is documented in the repository."
          fi
