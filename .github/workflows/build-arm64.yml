name: Build ARM64 package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/install-deps.sh

      - name: Build RK3588 multimedia stack
        run: ./scripts/build-rk3588-stack.sh

      - name: Build Debian package
        run: ./scripts/build-deb.sh

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: stremio-4.4.181-orp8-arm64
          path: stremio_4.4.181-orp8_arm64.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v4.4.181-orp8
          RELEASE_ASSET: stremio_4.4.181-orp8_arm64.deb
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
              --target "$GITHUB_SHA" \
              --title "Stremio 4.4.181 ARM64 RK3588 (orp8)" \
              --notes "Orange Pi 5 Pro test build. Hardware playback is validated on the board."
          fi
