name: Build ARM64 package

on:
  push:
    branches: [main, rk3588-native-gpu-next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Confirm native ARM64 runner
        run: |
          uname -a
          test "$(dpkg --print-architecture)" = arm64

      - name: Install Ubuntu 26.04 build dependencies
        run: ./scripts/install-deps.sh

      - name: Build pinned RK3588 V4L2-request FFmpeg and libmpv stack
        run: ./scripts/build-rk3588-stack.sh

      - name: Build official Stremio 4.4.181 source
        run: ./scripts/build.sh

      - name: Build Debian package
        run: ./scripts/build-deb.sh

      - name: Test apt installation and private RK3588 linkage
        run: |
          sudo apt-get install -y ./stremio_4.4.181-orp10_arm64.deb
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' stremio
          test -x /usr/bin/stremio
          test "$(readlink -f /usr/bin/stremio)" = /opt/stremio/stremio
          test "$(patchelf --print-rpath /opt/stremio/stremio)" = '$ORIGIN/rk3588/lib'
          test -f /opt/stremio/rk3588/input.conf
          ldd /opt/stremio/stremio | tee /tmp/stremio-ldd.txt
          grep -E 'libmpv\.so.*=> /opt/stremio/rk3588/lib/' /tmp/stremio-ldd.txt
          grep -E 'libavcodec\.so.*=> /opt/stremio/rk3588/lib/' /tmp/stremio-ldd.txt
          sudo apt-get remove -y stremio

      - name: Upload ARM64 Debian package
        uses: actions/upload-artifact@v4
        with:
          name: stremio-4.4.181-orp10-arm64
          path: stremio_4.4.181-orp10_arm64.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v4.4.181-orp10
          RELEASE_ASSET: stremio_4.4.181-orp10_arm64.deb
        run: |
          set -euxo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
              --target "$GITHUB_SHA" \
              --title "Stremio 4.4.181 ARM64 RK3588 native gpu-next (orp10)" \
              --notes "ARM64 Stremio package for Ubuntu 26.04 / Armbian on RK3588. Uses the pinned V4L2-request FFmpeg/mpv stack and mpv's native gpu-next video output instead of downstream libmpv rendering glue. Final playback validation is performed on the physical RK3588 board."
          fi
