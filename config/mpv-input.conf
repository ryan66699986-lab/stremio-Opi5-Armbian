# Controller bindings for Stremio's native mpv playback window.
# Key names come from mpv's SDL2 gamepad backend.
GAMEPAD_ACTION_DOWN cycle pause
GAMEPAD_DPAD_LEFT seek -10 relative+keyframes
GAMEPAD_DPAD_RIGHT seek 10 relative+keyframes
GAMEPAD_DPAD_UP add volume 5
GAMEPAD_DPAD_DOWN add volume -5
GAMEPAD_LEFT_SHOULDER seek -60 relative+keyframes
GAMEPAD_RIGHT_SHOULDER seek 60 relative+keyframes
GAMEPAD_START cycle fullscreen
GAMEPAD_BACK stop
